<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" formControlName="email" class="form-control" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span>Email je obavezan.</span>
    }
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" formControlName="password" class="form-control" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span>Lozinka mora imati minimalno 8 znakova.</span>
    }
  </div>

  @if (errorMessage !== '') {
    <p class="form-error-message">{{ errorMessage }}</p>
  }

  <button type="submit" [disabled]="form.invalid" class="btn btn-primary btn-full">Login</button>
</form>
